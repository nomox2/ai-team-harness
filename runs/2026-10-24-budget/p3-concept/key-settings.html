<!-- 컨셉: 설정 페이지 "정리하는 목록" — 홈·예산과 같은 흰 바탕과 얇은 구분선으로, 위에서 아래로 칩 → 카테고리 관리 → 즐겨찾기 관리를 같은 줄 모양으로 쌓는다. 즐겨찾기는 기록이 아니라 날짜 없이 이름·카테고리·금액만 두고(record-item 표시 안 씀), 금액은 수입 + 빨강·지출 − 파랑으로 기호와 색을 함께 쓴다. 설정 화면은 레퍼런스 근거가 약해 대표 확인이 필요하다. -->
<!DOCTYPE html>
<html lang="ko" data-frame="390x844">
<head>
<meta charset="utf-8">
<title>설정 - 컨셉</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #efefef; font-family: Pretendard, Inter, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #171717; }
.screen { position: relative; width: 390px; height: 844px; margin: 0 auto; background: #ffffff; overflow: hidden; }
.content { padding: 0 16px; }
.amount { font-family: Inter, Pretendard, sans-serif; font-variant-numeric: tabular-nums; }
a, button, .tab, .chip { min-height: 44px; }
a { color: inherit; text-decoration: none; }
button { font-family: Pretendard, Inter, -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #ffffff; border: 0; color: #707070; font-size: 14px; font-weight: 500; }

.titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 56px; padding-top: 8px; }
.titlebar .back { display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #707070; }
.titlebar h1 { font-size: 18px; font-weight: 500; line-height: 1.4; }

.chips { display: flex; gap: 8px; margin-top: 8px; }
.chip { display: flex; align-items: center; justify-content: center; padding: 0 16px; border: 1px solid #dfdfdf; border-radius: 9999px; background: #ffffff; font-size: 14px; font-weight: 500; color: #707070; }
.chip.current { background: #171717; border-color: #171717; color: #ffffff; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
.section-head h2 { font-size: 18px; font-weight: 500; line-height: 1.4; }
.section-head button { padding: 0 4px; }

.rows { list-style: none; }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #ededed; }
.rows li:last-child .row { border-bottom: 0; }
.row .icon { display: flex; align-items: center; justify-content: center; flex: none; width: 36px; height: 36px; border-radius: 9999px; background: #fafafa; font-size: 14px; font-weight: 500; color: #212121; }
.row .name { flex: 1; font-size: 16px; line-height: 1.5; color: #171717; }
.row .edit { padding: 0 4px; }

.fav .info { flex: 1; display: flex; flex-direction: column; }
.fav .fav-cat { font-size: 13px; line-height: 1.45; color: #707070; }
.fav .amount { font-size: 16px; font-weight: 700; line-height: 1.5; }
.fav.expense .amount { color: #054cff; }
.fav.income .amount { color: #ff2201; }

.btn-primary { position: absolute; right: 16px; bottom: 80px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 20px; border: 0; border-radius: 12px; background: #3ecf8e; color: #171717; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.btn-primary .plus { font-size: 22px; line-height: 1; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; background: #ffffff; border-top: 1px solid #ededed; }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9a9a9a; }
.tab.current { color: #171717; font-weight: 700; }
</style>
</head>
<body>
<div class="screen">
  <div class="content">
    <div class="titlebar">
      <a class="back" href="#">‹ 예산</a>
      <h1>설정</h1>
      <span></span>
    </div>

    <div class="chips">
      <a class="chip current" href="#">전체</a>
      <a class="chip" href="#">수입</a>
      <a class="chip" href="#">지출</a>
    </div>

    <div class="section-head">
      <h2>카테고리 관리</h2>
      <button type="button">추가</button>
    </div>
    <ul class="rows">
      <li class="row"><span class="icon">식</span><span class="name">식비</span><button class="edit" type="button">편집</button></li>
      <li class="row"><span class="icon">교</span><span class="name">교통</span><button class="edit" type="button">편집</button></li>
      <li class="row"><span class="icon">카</span><span class="name">카페</span><button class="edit" type="button">편집</button></li>
      <li class="row"><span class="icon">급</span><span class="name">급여</span><button class="edit" type="button">편집</button></li>
    </ul>

    <div class="section-head">
      <h2>즐겨찾기 관리</h2>
      <button type="button">추가</button>
    </div>
    <ul class="rows">
      <li class="row fav expense">
        <span class="info"><span class="name">커피</span><span class="fav-cat">카페</span></span>
        <span class="amount">−4,500원</span>
      </li>
      <li class="row fav income">
        <span class="info"><span class="name">월급</span><span class="fav-cat">급여</span></span>
        <span class="amount">+2,800,000원</span>
      </li>
    </ul>
  </div>

  <button class="btn-primary" data-nav="record"><span class="plus">+</span>기록하기</button>

  <nav class="tabbar">
    <a class="tab" href="#">홈</a>
    <a class="tab" href="#">내역</a>
    <a class="tab" href="#">통계</a>
    <a class="tab current" href="#">예산·설정</a>
  </nav>
</div>
</body>
</html>
