<!-- 컨셉: 예산 페이지 "숫자 먼저" — 홈의 연한 회색 카드·막대 문법을 이어서 이번 달 예산(600,000원)을 가장 크게 두고, 아래에 카테고리별로 얼마 썼는지를 같은 모양의 줄로 반복한다. 기록 항목이 아니라 카테고리 행이라 record-item 표시는 쓰지 않는다. 예산 수정 입력(저장·취소)은 기본 상태에서 열지 않아 그리지 않았고, 그래서 화면의 초록 채움 버튼은 "+ 기록하기" 하나뿐이다. -->
<!DOCTYPE html>
<html lang="ko" data-frame="390x844">
<head>
<meta charset="utf-8">
<title>예산 - 컨셉</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #efefef; font-family: Pretendard, Inter, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #171717; }
.screen { position: relative; width: 390px; height: 844px; margin: 0 auto; background: #ffffff; overflow: hidden; }
.content { padding: 0 16px; }
.amount { font-family: Inter, Pretendard, sans-serif; font-variant-numeric: tabular-nums; }
a, button, .tab { min-height: 44px; }
a { color: inherit; text-decoration: none; }
button { font-family: Pretendard, Inter, -apple-system, 'Apple SD Gothic Neo', sans-serif; }

.topbar { display: flex; justify-content: flex-end; align-items: center; height: 56px; padding-top: 8px; }
.topbar a { display: flex; align-items: center; padding: 0 4px; font-size: 14px; font-weight: 500; color: #707070; }

.budget-card { display: block; width: 100%; text-align: left; border: 0; background: #fafafa; border-radius: 12px; padding: 16px; color: #171717; min-height: 44px; }
.budget-card .label { display: block; font-size: 13px; line-height: 1.45; color: #707070; }
.budget-card .amount { display: block; margin-top: 4px; font-size: 28px; font-weight: 500; line-height: 1.25; letter-spacing: -0.42px; color: #171717; }
.bar { margin-top: 16px; height: 8px; border-radius: 9999px; background: #ededed; overflow: hidden; }
.bar-fill { width: 45%; height: 8px; background: #171717; border-radius: 9999px; }
.bar-text { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #707070; }
.bar-text .sub { font-family: Inter, Pretendard, sans-serif; font-variant-numeric: tabular-nums; color: #171717; }

.section-head { margin-top: 24px; }
.section-head h2 { font-size: 18px; font-weight: 500; line-height: 1.4; }

.cat-list { list-style: none; margin-top: 4px; }
.cat-row { display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #ededed; }
.cat-list li:last-child .cat-row { border-bottom: 0; }
.cat-row .icon { display: flex; align-items: center; justify-content: center; flex: none; width: 36px; height: 36px; border-radius: 9999px; background: #fafafa; font-size: 14px; font-weight: 500; color: #212121; }
.cat-row .info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.cat-row .name { font-size: 16px; line-height: 1.5; color: #171717; }
.mini-bar { height: 4px; border-radius: 9999px; background: #ededed; overflow: hidden; }
.mini-fill { height: 4px; background: #171717; border-radius: 9999px; }
.cat-row .amount { font-size: 16px; font-weight: 700; line-height: 1.5; color: #054cff; }

.btn-primary { position: absolute; right: 16px; bottom: 80px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 20px; border: 0; border-radius: 12px; background: #3ecf8e; color: #171717; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.btn-primary .plus { font-size: 22px; line-height: 1; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; background: #ffffff; border-top: 1px solid #ededed; }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9a9a9a; }
.tab.current { color: #171717; font-weight: 700; }
</style>
</head>
<body>
<div class="screen">
  <div class="content">
    <div class="topbar">
      <a href="#">설정</a>
    </div>

    <button class="budget-card" type="button">
      <span class="label">이번 달 예산</span>
      <span class="amount">600,000원</span>
      <div class="bar"><div class="bar-fill"></div></div>
      <div class="bar-text">
        <span>쓴 금액 <span class="sub">272,000원</span></span>
        <span>남은 금액 <span class="sub">328,000원</span></span>
      </div>
    </button>

    <div class="section-head">
      <h2>카테고리별 예산</h2>
    </div>
    <ul class="cat-list">
      <li><a class="cat-row" href="#">
        <span class="icon">식</span>
        <span class="info"><span class="name">식비</span><span class="mini-bar"><span class="mini-fill" style="display:block;width:44%"></span></span></span>
        <span class="amount">−120,000원</span>
      </a></li>
      <li><a class="cat-row" href="#">
        <span class="icon">교</span>
        <span class="info"><span class="name">교통</span><span class="mini-bar"><span class="mini-fill" style="display:block;width:19%"></span></span></span>
        <span class="amount">−52,000원</span>
      </a></li>
      <li><a class="cat-row" href="#">
        <span class="icon">카</span>
        <span class="info"><span class="name">카페</span><span class="mini-bar"><span class="mini-fill" style="display:block;width:14%"></span></span></span>
        <span class="amount">−38,000원</span>
      </a></li>
      <li><a class="cat-row" href="#">
        <span class="icon">쇼</span>
        <span class="info"><span class="name">쇼핑</span><span class="mini-bar"><span class="mini-fill" style="display:block;width:23%"></span></span></span>
        <span class="amount">−62,000원</span>
      </a></li>
    </ul>
  </div>

  <button class="btn-primary" data-nav="record"><span class="plus">+</span>기록하기</button>

  <nav class="tabbar">
    <a class="tab" href="#">홈</a>
    <a class="tab" href="#">내역</a>
    <a class="tab" href="#">통계</a>
    <a class="tab current" href="#">예산·설정</a>
  </nav>
</div>
</body>
</html>
