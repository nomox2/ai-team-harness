<!-- 컨셉: A "숫자 먼저" — 남은 예산을 연한 회색 카드(canvas-soft)에 가장 크게 두고, 오늘·이번 주 숫자를 나란히 둔다. 최근 내역은 날짜 머리글로 묶어 하루 합계를 한눈에 보게 하는, 기준 문서(design.md)에 가장 충실한 안. -->
<!DOCTYPE html>
<html lang="ko" data-frame="390x844">
<head>
<meta charset="utf-8">
<title>홈 - 컨셉 A</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #efefef; font-family: Pretendard, Inter, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #171717; }
.screen { position: relative; width: 390px; height: 844px; margin: 0 auto; background: #ffffff; overflow: hidden; }
.content { padding: 24px 16px 0 16px; }
.amount { font-family: Inter, Pretendard, sans-serif; font-variant-numeric: tabular-nums; }
a, button, .tab { min-height: 44px; }
a { color: inherit; text-decoration: none; }
button { font-family: Pretendard, Inter, -apple-system, 'Apple SD Gothic Neo', sans-serif; }

.budget-left { background: #fafafa; border-radius: 12px; padding: 16px; }
.budget-left .label { display: block; font-size: 13px; line-height: 1.45; color: #707070; }
.budget-left .amount { display: block; margin-top: 4px; font-size: 28px; font-weight: 500; line-height: 1.25; letter-spacing: -0.42px; color: #171717; }
.bar { margin-top: 16px; height: 8px; border-radius: 9999px; background: #ededed; overflow: hidden; }
.bar-fill { width: 45%; height: 8px; background: #171717; border-radius: 9999px; }
.bar-text { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #707070; }
.bar-text .sub { font-family: Inter, Pretendard, sans-serif; font-variant-numeric: tabular-nums; color: #171717; }

.stats { display: flex; gap: 12px; margin-top: 12px; }
.stat { flex: 1; min-height: 64px; border: 1px solid #dfdfdf; border-radius: 12px; padding: 12px 16px; }
.stat .label { display: block; font-size: 13px; line-height: 1.45; color: #707070; }
.stat .num { display: block; margin-top: 2px; font-family: Inter, Pretendard, sans-serif; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 500; line-height: 1.4; color: #054cff; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
.section-head h2 { font-size: 18px; font-weight: 500; line-height: 1.4; }
.section-head a { display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #707070; }

.day-head { display: flex; justify-content: space-between; margin-top: 4px; padding: 8px 0 4px 0; font-size: 13px; line-height: 1.45; color: #707070; }
.records { list-style: none; }
.record-item { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #ededed; }
.record-item:last-child { border-bottom: 0; }
.icon { display: flex; align-items: center; justify-content: center; flex: none; width: 36px; height: 36px; border-radius: 9999px; background: #fafafa; font-size: 14px; font-weight: 500; color: #212121; }
.info { flex: 1; display: flex; flex-direction: column; }
.category { font-size: 16px; line-height: 1.5; color: #171717; }
.date { font-size: 13px; line-height: 1.45; color: #707070; }
.record-item .amount { font-size: 16px; font-weight: 700; line-height: 1.5; }
.record-item[data-kind="expense"] .amount { color: #054cff; }
.record-item[data-kind="income"] .amount { color: #ff2201; }

.btn-primary { position: absolute; right: 16px; bottom: 80px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 20px; border: 0; border-radius: 12px; background: #3ecf8e; color: #171717; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.btn-primary .plus { font-size: 22px; line-height: 1; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; background: #ffffff; border-top: 1px solid #ededed; }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9a9a9a; }
.tab.current { color: #171717; font-weight: 700; }
</style>
</head>
<body>
<div class="screen">
  <div class="content">
    <section class="budget-left">
      <span class="label">이번 달 남은 예산</span>
      <span class="amount">328,000원</span>
      <div class="bar"><div class="bar-fill"></div></div>
      <div class="bar-text">
        <span>쓴 금액 <span class="sub">272,000원</span></span>
        <span>남은 금액 <span class="sub">328,000원</span></span>
      </div>
    </section>

    <div class="stats">
      <div class="stat">
        <span class="label">오늘 쓴 돈</span>
        <span class="num">−12,500원</span>
      </div>
      <div class="stat">
        <span class="label">이번 주 쓴 돈</span>
        <span class="num">−86,000원</span>
      </div>
    </div>

    <div class="section-head">
      <h2>최근 내역</h2>
      <a href="#">전체 보기</a>
    </div>

    <div class="day-head"><span>10월 24일</span><span>지출 12,500원</span></div>
    <ul class="records">
      <li class="record-item" data-kind="expense">
        <span class="icon">식</span>
        <span class="info"><span class="category">식비</span><span class="date">10월 24일</span></span>
        <span class="amount">−4,500원</span>
      </li>
      <li class="record-item" data-kind="expense">
        <span class="icon">교</span>
        <span class="info"><span class="category">교통</span><span class="date">10월 24일</span></span>
        <span class="amount">−8,000원</span>
      </li>
    </ul>
    <div class="day-head"><span>10월 23일</span><span>수입 2,800,000원</span></div>
    <ul class="records">
      <li class="record-item" data-kind="income">
        <span class="icon">급</span>
        <span class="info"><span class="category">급여</span><span class="date">10월 23일</span></span>
        <span class="amount">+2,800,000원</span>
      </li>
    </ul>
  </div>

  <button class="btn-primary" data-nav="record"><span class="plus">+</span>기록하기</button>

  <nav class="tabbar">
    <a class="tab current" href="#">홈</a>
    <a class="tab" href="#">내역</a>
    <a class="tab" href="#">통계</a>
    <a class="tab" href="#">예산·설정</a>
  </nav>
</div>
</body>
</html>
